# Connection comes from WAREHOUSE_* env vars. The Airflow DAG sets them for the run's
# target (local Docker Postgres or Supabase). Defaults point at the local Docker
# Postgres from the host; set WAREHOUSE_PORT=5433 if POSTGRES_HOST_PORT=5433 in .env.
ghg_emissions:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'warehouse') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'postgres') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'postgres') }}"
      sslmode: "{{ env_var('WAREHOUSE_SSLMODE', 'prefer') }}"
      schema: public
      threads: 4
